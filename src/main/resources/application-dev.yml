spring:
  config:
    activate:
      on-profile: dev
    import: "optional:application-dev-local.yml"

  datasource:
    # Host "postgres": el nombre del servicio en .devcontainer/docker-compose.yml,
    # no "localhost" (la aplicación corre dentro del contenedor "app")
    url: jdbc:postgresql://postgres:5432/libreria_db
    username: libreria_user
    password: password123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      # Evitar que data.sql reinicie el catálogo en cada arranque
      mode: never

springdoc:
  swagger-ui:
    path: /documentacion
    operations-sorter: method

management:
  endpoint:
    health:
      show-details: always

libreria:
  jwt:
    expiration-minutes: 15

